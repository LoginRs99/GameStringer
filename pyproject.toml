[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gamestringer"
version = "2.0.0"
description = "Project-config and preflight GUI wrapping the LocPipe translation pipeline (Antigravity CLI provider)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "polib>=1.2",
    "pyspellchecker>=0.8.0",
]

[project.scripts]
gamestringer = "gamestringer.cli:main"
gamestringer-gui = "gamestringer.desktop_gui.app:main"
locpipe = "locpipe.cli:main"

[tool.setuptools]
packages = [
    "gamestringer",
    "gamestringer.core",
    "gamestringer.desktop_gui",
    "gamestringer.desktop_gui.tabs",
    "locpipe",
    "locpipe.adapters",
    "locpipe.providers",
    "locpipe.validators",
]

[tool.setuptools.package-dir]
"locpipe" = "locpipe/src/locpipe"

[tool.setuptools.package-data]
locpipe = ["agents/*.md", "validators/*.json.gz"]
